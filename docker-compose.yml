# The whole system (Postgres + the app) with one command:
#
#   docker compose up -d --build --wait     # or: npm run docker:up
#
# then open http://localhost:3000 (APP_PORT overrides the host port). The app
# container applies the migrations, seeds the demo data into an empty database
# and starts the production server. No `.env` is needed: everything is set
# below. Stop with `docker compose down` (add `-v` to delete the data too).
#
# `npm run dev:all` and `npm run test:all` start only the `db` service:
#
#   docker compose up -d --wait db
#
# Database credentials and port match DATABASE_URL in .env.example.
# CHORES_DB_PORT overrides the database's host port (default 5432).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${CHORES_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: chores
      POSTGRES_PASSWORD: chores
      POSTGRES_DB: chores
    volumes:
      - chores-db:/var/lib/postgresql/data
    # Healthy once Postgres accepts TCP connections. Checking over TCP (not the
    # socket) skips the temporary server the image runs during first-time init.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "chores", "-d", "chores"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The production build (Dockerfile). On start: `prisma migrate deploy`, the
  # seed with --skip-if-seeded, then the Next.js server on port 3000.
  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # `db` is the database service's name inside the Compose network.
      DATABASE_URL: postgresql://chores:chores@db:5432/chores?schema=public
      DIRECT_URL: postgresql://chores:chores@db:5432/chores?schema=public
      # LOCAL USE ONLY: this default secret is public. Set AUTH_SECRET in the
      # shell (e.g. `openssl rand -base64 33`) for anything beyond your machine.
      AUTH_SECRET: ${AUTH_SECRET:-docker-compose-local-only-secret-do-not-use-in-production}
      AUTH_URL: http://localhost:${APP_PORT:-3000}
      AUTH_TRUST_HOST: "true"
    # Healthy once the sign-in page answers 200 (migrations and seed are done
    # by then). Uses the image's own Node; no curl in the image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/signin').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  chores-db:
