# The whole system (Postgres + the app) with one command:
#
#   docker compose up -d --build --wait     # or: npm run docker:up
#
# then open http://localhost:3000 (APP_PORT overrides the host port). The app
# container applies the migrations, seeds the demo data into an empty database
# and starts the production server. No `.env` is needed: everything is set
# below. Stop with `docker compose down` (add `-v` to delete the data too).
#
# `npm run dev:all` and `npm run test:all` start only the `db` service:
#
#   docker compose up -d --wait db
#
# Database credentials and port match DATABASE_URL in .env.example.
# CHORES_DB_PORT overrides the database's host port (default 5432).
#
# Observability (opt-in, the `observability` profile): an OpenTelemetry
# Collector with Tempo (traces), Loki (logs), Prometheus (metrics) and Grafana
# in one container, plus `alert-receiver`, a webhook that logs Grafana's alert
# notifications. Plain `docker compose up` starts neither.
#
#   npm run observability:up        # just the stack, for `npm run dev`
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4318 \
#     docker compose --profile observability up -d --build --wait
#                                   # the stack and the app exporting to it
#
# Grafana: http://localhost:3001 (OBSERVABILITY_UI_PORT); OTLP/HTTP on
# localhost:4318 (OTLP_HTTP_PORT). See README "Observability".

services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${CHORES_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: chores
      POSTGRES_PASSWORD: chores
      POSTGRES_DB: chores
    volumes:
      - chores-db:/var/lib/postgresql/data
    # Healthy once Postgres accepts TCP connections. Checking over TCP (not the
    # socket) skips the temporary server the image runs during first-time init.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "chores", "-d", "chores"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The production build (Dockerfile). On start: `prisma migrate deploy`, the
  # seed with --skip-if-seeded, then the Next.js server on port 3000.
  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # `db` is the database service's name inside the Compose network.
      DATABASE_URL: postgresql://chores:chores@db:5432/chores?schema=public
      DIRECT_URL: postgresql://chores:chores@db:5432/chores?schema=public
      # LOCAL USE ONLY: this default secret is public. Set AUTH_SECRET in the
      # shell (e.g. `openssl rand -base64 33`) for anything beyond your machine.
      AUTH_SECRET: ${AUTH_SECRET:-docker-compose-local-only-secret-do-not-use-in-production}
      AUTH_URL: http://localhost:${APP_PORT:-3000}
      AUTH_TRUST_HOST: "true"
      # Telemetry stays off unless this is set (see the header comment).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Healthy once the sign-in page answers 200 (migrations and seed are done
    # by then). Uses the image's own Node; no curl in the image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/signin').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

  # Collector + Tempo + Loki + Prometheus + Grafana (profile `observability`).
  # Grafana starts with the datasources linked (trace <-> logs by trace_id),
  # the "Complete a chore" dashboard, and the alert rules, contact point and
  # notification policy, all from observability/grafana/.
  # Anonymous admin access: for local use only.
  observability:
    image: grafana/otel-lgtm:0.11.10
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "${OBSERVABILITY_UI_PORT:-3001}:3000"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    environment:
      # Links in alert notifications (rule, silence, dashboard) open here.
      GF_SERVER_ROOT_URL: http://localhost:${OBSERVABILITY_UI_PORT:-3001}/
    volumes:
      - observability-data:/data
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/chores.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/chores-dashboards:ro
      - ./observability/grafana/alerting/alert-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/chores-alert-rules.yaml:ro
      - ./observability/grafana/alerting/notifications.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/chores-notifications.yaml:ro
    # Grafana starts last, after the collector and the backends.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  # Stand-in for a real notification channel (profile `observability`):
  # Grafana's webhook contact point posts each alert notification here, and
  # the request, body included, is printed to this container's log:
  #   docker compose logs -f alert-receiver
  # Not published on the host; only Grafana talks to it.
  alert-receiver:
    image: mendhak/http-https-echo:43
    profiles: [observability]
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
      LOG_WITHOUT_NEWLINE: "true"

volumes:
  chores-db:
  observability-data:
