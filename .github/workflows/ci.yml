name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chores
          POSTGRES_PASSWORD: chores
          POSTGRES_DB: chores
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chores -d chores"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chores:chores@localhost:5432/chores?schema=public
      DIRECT_URL: postgresql://chores:chores@localhost:5432/chores?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `postinstall` runs `prisma generate`, so the @prisma/client types exist
      # before typecheck.
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Exit code 2 means the migrated database differs from schema.prisma,
      # i.e. a schema change has no migration. Fails the build.
      - name: Check schema matches migrations
        run: >-
          npx prisma migrate diff
          --from-url "$DIRECT_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The real Server Actions and Prisma client against the migrated
      # Postgres service. The suite truncates every table; the service
      # database is thrown away with the job, so it is used directly.
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: npm run build

      # End-to-end smoke tests: Chromium against the production build above
      # and the migrated Postgres service. Browsers are cached per Playwright
      # version; the system libraries are installed on every run.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    # The containerized system: build the image and start db + app with the
    # one command from the README, then check the app answers and that the
    # entrypoint loaded the demo data.

    steps:
      - uses: actions/checkout@v7

      - name: Start the Compose stack
        run: docker compose up -d --build --wait

      - name: Sign-in page returns 200
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/signin)
          echo "GET /signin -> $status"
          test "$status" = "200"

      - name: Demo household exists
        run: |
          count=$(docker compose exec -T db psql -U chores -d chores -tAc \
            "select count(*) from \"Household\" where id = 'demo-household'")
          echo "demo households: $count"
          test "$count" = "1"

      - name: Compose logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Remove the Compose stack
        if: always()
        run: docker compose down -v
