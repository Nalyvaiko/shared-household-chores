name: Deploy to production

# Manual production deploy: Actions > Deploy to production > Run workflow
# (from main). The `check` job makes sure the commit is on main and passed CI;
# the `production` environment then waits for a required reviewer to approve
# before anything is built or deployed. Setup: README, "CI/CD".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to deploy (must be on main)
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

# One production deploy at a time; never cancel one mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 65.5.0
  PRODUCTION_URL: https://shared-household-chores.vercel.app

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check deploy secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them in Settings > Secrets and variables > Actions (README, CI/CD setup)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check the commit is on main and passed CI
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Deploying $sha ($REF)"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Only merged commits deploy to production."
            exit 1
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --json databaseId --jq length)
          if [ "$passed" = "0" ]; then
            echo "::error::CI has no successful run for $sha."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://shared-household-chores.vercel.app

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      # Production environment variables = the production database.
      - name: Pull the Vercel Production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Runs `npm run vercel-build`: `prisma migrate deploy` against the
      # production database, then `next build`. No demo data is loaded.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # --prod assigns the production domains, including PRODUCTION_URL.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Smoke tests against production. Same browser caching as ci.yml.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The specs only create their own e2e-… users and households.
      - name: Smoke tests against production
        run: npm run test:e2e:remote
        env:
          E2E_BASE_URL: ${{ env.PRODUCTION_URL }}
